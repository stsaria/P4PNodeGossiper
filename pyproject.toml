[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "P4PNodeGossiper"
dynamic = ["version"]
description = "A gossiper for finding nodes with P4PCore."
readme = "README.md"
dependencies = [
    "P4PCore>=1.1rc1,<2.0"
]
license = { file = "LICENSE" }
requires-python = ">=3.13"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"